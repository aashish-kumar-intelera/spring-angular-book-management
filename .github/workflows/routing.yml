name: "Stagr route classification"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: "stagr-routing-${{ github.event.pull_request.number }}${{ (github.event.action == 'edited' && github.event.changes.base == '') && '-noop' || '' }}"
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target' || github.event.action != 'edited' || github.event.changes.base != ''
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Acquire Stagr App installation token
        id: app-token
        uses: actions/create-github-app-token@c1a285145b9d317df6ced56c09f525b5c2b6f755  # v1.11.1
        with:
          app-id: "5239405"
          private-key: "${{ secrets.STAGR_APP_PRIVATE_KEY }}"

      - name: Publish RouteClassification Check Run (NORMAL — fast path disabled)
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          STAGR_APP_ID: "5239405"
        run: |
          set -euo pipefail
          existing_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=stagr/route-classification&filter=all&per_page=2" \
            --jq '.check_runs' 2>&1) || {
            echo "::error::Failed to query existing RouteClassification Check Runs."
            exit 1
          }
          existing_run_id=$(echo "${existing_runs}" | jq --arg app_id "${STAGR_APP_ID}" \
            -r '[.[] | select(.app.id | tostring == $app_id)][0].id // empty')
          if [[ -n "${existing_run_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${existing_run_id}" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=RouteClassification=NORMAL" \
              -f "output[summary]=Fast path is disabled; all PRs are routed to the NORMAL lane."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f "name=stagr/route-classification" \
              -f "head_sha=${HEAD_SHA}" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=RouteClassification=NORMAL" \
              -f "output[summary]=Fast path is disabled; all PRs are routed to the NORMAL lane."
          fi
